apiVersion: v1
kind: Namespace
metadata:
  name: ahm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
  namespace: ahm
  annotations:
    azure.workload.identity/client-id: {{.Env.AZURE_IDENTITY_CLIENT_ID}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-app
  namespace: ahm
  labels:
    app.kubernetes.io/name: agent-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload
      containers:
        - name: agent-app
          image: {{.Env.SERVICE_AGENT_APP_AKS_IMAGE_NAME}}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_CLIENT_ID
              value: {{.Env.AZURE_IDENTITY_CLIENT_ID}}
            - name: AZURE_OPENAI_ENDPOINT
              value: {{.Env.AZURE_OPENAI_ENDPOINT}}
            - name: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
              value: {{.Env.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}}
            - name: HEALTH_APP_BASE_URL
              value: http://web:8080/
            - name: HEALTH_API_TIMEOUT_SECONDS
              value: "8"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: {{.Env.APPLICATIONINSIGHTS_CONNECTION_STRING}}
            - name: APPLICATIONINSIGHTS_AUTHENTICATION_STRING
              value: Authorization=AAD;ClientId={{.Env.AZURE_IDENTITY_CLIENT_ID}}
            - name: OTEL_SERVICE_NAME
              value: ahm-health-copilot
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-app
  namespace: ahm
  labels:
    app.kubernetes.io/name: agent-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
