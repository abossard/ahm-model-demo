apiVersion: v1
kind: Namespace
metadata:
  name: ahm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
  namespace: ahm
  annotations:
    azure.workload.identity/client-id: {{.Env.AZURE_IDENTITY_CLIENT_ID}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ahm
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload
      containers:
        - name: web
          image: {{.Env.SERVICE_WEB_AKS_IMAGE_NAME}}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AZURE_CLIENT_ID
              value: {{.Env.AZURE_IDENTITY_CLIENT_ID}}
            - name: QUEUE_URL
              value: {{.Env.AZURE_QUEUE_URL}}
            - name: POSTGRES_HOST
              value: {{.Env.AZURE_POSTGRES_HOST}}
            - name: POSTGRES_DATABASE
              value: {{.Env.AZURE_POSTGRES_DATABASE}}
            - name: POSTGRES_USER
              value: {{.Env.AZURE_IDENTITY_NAME}}
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: {{.Env.APPLICATIONINSIGHTS_CONNECTION_STRING}}
            - name: APPLICATIONINSIGHTS_AUTHENTICATION_STRING
              value: Authorization=AAD;ClientId={{.Env.AZURE_IDENTITY_CLIENT_ID}}
            - name: OTEL_SERVICE_NAME
              value: {{.Env.AZURE_ENV_NAME}}
            - name: AZURE_SUBSCRIPTION_ID
              value: {{.Env.AZURE_SUBSCRIPTION_ID}}
            - name: AZURE_SUBSCRIPTION_NAME
              value: {{.Env.AZURE_SUBSCRIPTION_NAME}}
            - name: AZURE_RESOURCE_GROUP
              value: {{.Env.AZURE_RESOURCE_GROUP}}
            - name: HEALTH_MODEL_NAME
              value: {{.Env.HEALTH_MODEL_NAME}}
            - name: HEALTH_MODEL_LOCATION
              value: {{.Env.HEALTH_MODEL_LOCATION}}
            - name: HEALTH_COPILOT_ENABLED
              value: "true"
            - name: AGENT_WEB_ORIGIN
              value: http://agent-web:3000
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ahm
  labels:
    app.kubernetes.io/name: web
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
