name: Onboarding tour

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/onboarding-tour.yml'
      - 'Makefile'
      - 'src/web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Record ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: onboarding-tour
            guide: tour
          - target: core-walkthrough
            guide: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/web/ui/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Install FFmpeg and Chromium system dependencies
        working-directory: src/web/ui
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npm ci --no-audit --no-fund
          npx --no-install playwright install-deps chromium
      - name: Record the local walkthrough
        run: make ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: docs/onboarding/${{ matrix.guide }}/
          if-no-files-found: error
