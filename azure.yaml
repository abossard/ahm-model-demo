# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ahm-model-demo
metadata:
  template: ahm-model-demo@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  web:
    project: ./src/web
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true

  mcp:
    project: ./src/mcp
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true

hooks:
  postprovision:
    shell: sh
    interactive: true
    run: bash ./scripts/hooks/postprovision.sh
  postdeploy:
    shell: sh
    interactive: true
    run: bash ./src/agent/deploy/deploy-agent.sh
  postup:
    shell: sh
    interactive: true
    run: bash ./scripts/hooks/postup.sh
