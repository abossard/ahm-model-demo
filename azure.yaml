# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ahm-model-demo
metadata:
  template: ahm-model-demo@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  web:
    project: ./src/web
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
  agent-web:
    project: ./src/agent-web
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
  agent-app:
    project: ./src/agent-app
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
  web-aks:
    project: ./src/web
    language: py
    host: aks
    docker:
      path: ./Dockerfile
      remoteBuild: true
    k8s:
      namespace: ahm
      deploymentPath: manifests
  agent-web-aks:
    project: ./src/agent-web
    language: ts
    host: aks
    docker:
      path: ./Dockerfile
      remoteBuild: true
    k8s:
      namespace: ahm
      deploymentPath: manifests
  agent-app-aks:
    project: ./src/agent-app
    language: py
    host: aks
    docker:
      path: ./Dockerfile
      remoteBuild: true
    k8s:
      namespace: ahm
      deploymentPath: manifests

hooks:
  preprovision:
    shell: sh
    run: bash ./scripts/hooks/preprovision.sh
  postprovision:
    shell: sh
    run: bash ./scripts/hooks/postprovision.sh
